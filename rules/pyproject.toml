[project]
name = "amgraph-rules"
# Bumped with `RULES_VERSION` and tagged `rules-v<version>`: the tag is what a
# consumer pins, and every release records the version it was built under.
version = "1.0.0"
description = "Dutch AM-licence vehicle classes, their limits and their by-laws."
requires-python = ">=3.11"
# Noncommercial, like the rest of the project. A consumer installing this by
# tag is agreeing to those terms; NOTICE.md says why the graph itself differs.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
# Deliberately none. This is the half of the access rules that has to be
# readable at run time as well as at build time, and a dependency here would
# land in the tree of everything that serves a graph. If something in here needs
# a library, it is probably pipeline code and belongs a directory up.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amgraph_rules"]
