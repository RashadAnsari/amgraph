name: Graph

# Builds the routing graph, gates it, and publishes it as a numbered release.
#
# OpenStreetMap changes daily and the whole product rests on access tags that
# volunteers add and correct, so this runs weekly whether or not the rules have
# moved; it also runs on every push to master, because a change to the rules is
# a change to which roads a rider may be sent down and should not wait for
# Monday.
#
# Nothing is published on a red build. A stale graph that obeys the law beats a
# fresh one that does not, so the gates come before the release and there is no
# path that reverses them.
#
# The gates here read the extract, which is stronger than sampling routes but
# blind to one failure: a router that has stopped routing passes every legality
# check, because "no lawful path" is a legitimate answer. The running-router
# gate therefore measures reachability in every supported country as well.

on:
  push:
    branches: [master]
  # On a pull request this runs the same gates and publishes nothing, so a rules
  # change is audited against the whole country before it is merged rather than
  # after. Limited to what can actually reach the tiles: an hour of extract,
  # overlay and tile work proves nothing about a README, and Check already runs
  # on every pull request whatever it touches.
  pull_request:
    paths:
      - "valhalla/**"
      - "infra/**"
      - "rules/**"
      - "tests/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/graph.yml"
  schedule:
    # Early Monday, after Geofabrik's nightly extracts have settled.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  # Everything that can publish shares one group, because the release number is
  # read, incremented and claimed in three separate steps and two runs in flight
  # would claim the same one. A pull request publishes nothing, so it gets a
  # group per branch instead: sharing one would let a pull request stall master
  # for an hour, and `cancel-in-progress: false` means it would wait it out.
  group: graph-${{ github.event_name == 'pull_request' && github.head_ref || 'release' }}
  # A superseded pull-request build answers a question nobody is asking any
  # more. A superseded release build still owes somebody a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify the graph
    runs-on: ubuntu-latest
    # Includes every country download, authority overlay, merge and route gate.
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact patch, not a major: setup-uv stopped publishing
        # moving `vN` tags at v8, so `@v10` resolves to nothing at all.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Free disk space on the runner
        # A hosted runner ships with ~14 GB free. The extract, the tiles and
        # the tar together need more than that unless the preinstalled
        # toolchains go first.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Unit-test the rules before spending an hour on a graph
        run: make verify

      - name: Fetch and enrich every supported country
        run: make country-prepare

      - name: Audit every supported country's complete input
        run: make test-audit

      - name: Select real cycle edges for carrier checks
        run: uv run python infra/collect_probes.py

      - name: Merge and build the single multi-country graph
        run: make country-graph

      - name: Start the router on the new graph
        run: |
          docker run -d --name valhalla -p 127.0.0.1:8002:8002 \
            -v "$PWD/infra/work:/data:ro" \
            ghcr.io/valhalla/valhalla@sha256:e84a20c31605048c5bf4860f2bcf48c2e3f3d9f2ec8ff13d1497fed055310081 \
            valhalla_service /data/valhalla.json 2
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8002/status >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8002/status

      # Everything upstream can be right and the rider still get the old answer
      # if the tiles being served predate any of it. These ask the running
      # router rather than a file, which is the only way to tell the two apart.
      - name: Check the router is serving the graph that was just built
        run: |
          uv run pytest -m graph tests/test_graph_is_current.py -q
          uv run python infra/verify_routes.py --url http://localhost:8002

      - name: Report what was built
        run: ls -lh infra/work/valhalla/tiles.tar infra/work/valhalla/admin.sqlite

      - name: Dump router logs on failure
        if: failure()
        run: docker logs valhalla 2>&1 | tail -100

      # Everything below only runs on green, which is the entire point.

      - name: Work out the next release number
        # GitHub does not number releases, so the number is the highest one
        # already claimed plus one. Taken as a maximum over every release
        # rather than from the newest row: sorting is lexical somewhere in that
        # path, and `release-9` sorts after `release-10`.
        if: github.event_name != 'pull_request'
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(gh release list --limit 1000 --json tagName --jq \
            '[.[].tagName | select(test("^release-[0-9]+$")) | ltrimstr("release-") | tonumber] | max // 0')
          echo "number=$(( highest + 1 ))" >> "$GITHUB_OUTPUT"
          echo "==> Release $(( highest + 1 ))"

      - name: Write the manifest
        # rules_version comes out of the country module rather than a string
        # here, so it is the version the tiles were actually built under, and a
        # consumer can refuse a release that disagrees with the package it pins.
        run: |
          uv run python infra/manifest.py \
            --release "${{ steps.next.outputs.number || '0' }}" \
            --output infra/work/manifest.json

      - name: Package the graph
        # Exactly what serving the graph needs and nothing else: the engine
        # files, every country boundary, the combined legal zones,
        # and the manifest. No runtime reads the source extracts.
        run: |
          uv run python infra/package_graph.py \
            --output "$GITHUB_WORKSPACE/amgraph-${{ steps.next.outputs.number || '0' }}.zip"
          ls -lh "$GITHUB_WORKSPACE/amgraph-${{ steps.next.outputs.number || '0' }}.zip"

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built from \`$GITHUB_SHA\`, gated on every access-tag"
            echo "combination in every supported country before it was published."
            echo
            echo '```json'
            cat infra/work/manifest.json
            echo '```'
          } > notes.md
          gh release create "release-${{ steps.next.outputs.number }}" \
            --title "Release ${{ steps.next.outputs.number }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/amgraph-${{ steps.next.outputs.number }}.zip"
