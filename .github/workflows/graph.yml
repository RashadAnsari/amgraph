name: Graph

# Builds the routing graph, gates it, and publishes it as a numbered release.
#
# OpenStreetMap changes daily and the whole product rests on access tags that
# volunteers add and correct, so this runs weekly whether or not the rules have
# moved; it also runs on every push to master, because a change to the rules is
# a change to which roads a rider may be sent down and should not wait for
# Monday.
#
# Nothing is published on a red build. A stale graph that obeys the law beats a
# fresh one that does not, so the gates come before the release and there is no
# path that reverses them.
#
# The gates here read the extract, which is stronger than sampling routes but
# blind to one failure: a router that has stopped routing passes every legality
# check, because "no lawful path" is a legitimate answer. Whoever serves a
# release should route against it before trusting it.

on:
  push:
    branches: [master]
  # On a pull request this runs the same gates and publishes nothing, so a rules
  # change is audited against the whole country before it is merged rather than
  # after. Limited to what can actually reach the tiles: an hour of extract,
  # overlay and tile work proves nothing about a README, and Check already runs
  # on every pull request whatever it touches.
  pull_request:
    paths:
      - "valhalla/**"
      - "infra/**"
      - "rules/**"
      - "tests/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/graph.yml"
  schedule:
    # Early Monday, after Geofabrik's nightly extracts have settled.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      extract_url:
        description: Geofabrik extract to build from
        default: https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
        required: false

concurrency:
  # Everything that can publish shares one group, because the release number is
  # read, incremented and claimed in three separate steps and two runs in flight
  # would claim the same one. A pull request publishes nothing, so it gets a
  # group per branch instead: sharing one would let a pull request stall master
  # for an hour, and `cancel-in-progress: false` means it would wait it out.
  group: graph-${{ github.event_name == 'pull_request' && github.head_ref || 'release' }}
  # A superseded pull-request build answers a question nobody is asking any
  # more. A superseded release build still owes somebody a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXTRACT_URL: ${{ inputs.extract_url || 'https://download.geofabrik.de/europe/netherlands-latest.osm.pbf' }}

jobs:
  build:
    name: Build and verify the graph
    runs-on: ubuntu-latest
    # A Netherlands build takes about two minutes of tile work on a laptop;
    # a hosted runner with a cold download needs considerably more headroom.
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Free disk space on the runner
        # A hosted runner ships with ~14 GB free. The extract, the tiles and
        # the tar together need more than that unless the preinstalled
        # toolchains go first.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Unit-test the rules before spending an hour on a graph
        run: make verify

      - name: Fetch a fresh OpenStreetMap extract
        run: make infra-extract EXTRACT_URL="$EXTRACT_URL"

      # OpenStreetMap cannot carry the mandatory-use rule: it states the
      # obligation on a fraction of the roads that carry it. Rijkswaterstaat
      # publishes the answer per road section, refreshed monthly, so the weekly
      # rebuild picks up the newest release rather than a pinned one.
      - name: Fetch the road authority's access decisions
        run: make infra-official-data

      - name: Match those decisions onto OpenStreetMap ways
        # WKD is closure-only. Positive answers are discarded because NDW
        # documents sign-to-road coupling errors and a geometric affirmation
        # must never legalise an OSM way.
        run: make infra-official-access

      # The strongest gate there is: it reads the extract the graph will be
      # built from and puts *every* distinct combination of access tags in the
      # country through the rules — about fifteen thousand of them — so a pass
      # means no way in the Netherlands can be offered to a class the law bars
      # from it. Not a sample, which is what routing against a built graph is.
      #
      # Here rather than after the build, and the placement is the point: it
      # needs the extract and not a router, so running it first fails a bad
      # rules change before an hour is spent on tiles, and before the disk
      # cleanup below deletes what it reads.
      - name: Audit every access-tag combination, and that the overlay bites
        # The second half matters as much as the first. A closure-only overlay
        # can be present but inert if none of its tags changes carrier access,
        # and this also asserts that the two permissive overlay values stay
        # inside the cases their statute reaches.
        run: make test-audit

      - name: Drop the build inputs the graph no longer needs
        # The working set is ~6.9 GB and a hosted runner has ~14 GB after the
        # cleanup above. The shapefiles, the 1 GB sign register and the plain
        # extract have all been consumed by this point; only the enriched
        # extract feeds the graph.
        run: |
          rm -rf infra/work/wkd infra/work/ndw
          rm -f infra/work/netherlands-latest.osm.pbf
          df -h /

      - name: Build the routing graph
        # The build accepts only the enriched extract. A plain extract has
        # neither mandatory-use decisions nor supported-country attribution.
        run: make infra-graph

      - name: Start the router on the new graph
        run: |
          docker run -d --name valhalla -p 127.0.0.1:8002:8002 \
            -v "$PWD/infra/work:/data:ro" \
            ghcr.io/valhalla/valhalla@sha256:e84a20c31605048c5bf4860f2bcf48c2e3f3d9f2ec8ff13d1497fed055310081 \
            valhalla_service /data/valhalla.json 2
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8002/status >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8002/status

      # Everything upstream can be right and the rider still get the old answer
      # if the tiles being served predate any of it. These ask the running
      # router rather than a file, which is the only way to tell the two apart.
      - name: Check the router is serving the graph that was just built
        run: uv run pytest -m graph tests/test_graph_is_current.py -q

      - name: Report what was built
        run: ls -lh infra/work/valhalla/tiles.tar infra/work/valhalla/admin.sqlite

      - name: Dump router logs on failure
        if: failure()
        run: docker logs valhalla 2>&1 | tail -100

      # Everything below only runs on green, which is the entire point.

      - name: Work out the next release number
        # GitHub does not number releases, so the number is the highest one
        # already claimed plus one. Taken as a maximum over every release
        # rather than from the newest row: sorting is lexical somewhere in that
        # path, and `release-9` sorts after `release-10`.
        if: github.event_name != 'pull_request'
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(gh release list --limit 1000 --json tagName --jq \
            '[.[].tagName | select(test("^release-[0-9]+$")) | ltrimstr("release-") | tonumber] | max // 0')
          echo "number=$(( highest + 1 ))" >> "$GITHUB_OUTPUT"
          echo "==> Release $(( highest + 1 ))"

      - name: Write the manifest
        # rules_version comes out of the country module rather than a string
        # here, so it is the version the tiles were actually built under, and a
        # consumer can refuse a release that disagrees with the package it pins.
        if: github.event_name != 'pull_request'
        run: |
          uv run python infra/manifest.py \
            --release "${{ steps.next.outputs.number }}" \
            --extract-url "$EXTRACT_URL" \
            --output infra/work/manifest.json

      - name: Package the graph
        # Exactly what serving the graph needs and nothing else: the engine
        # files, the BRK boundary these tiles cover, the municipal legal zones,
        # and the manifest. The extract is deliberately absent — it is 1.3 GB
        # and no runtime reads it.
        if: github.event_name != 'pull_request'
        run: |
          cd infra/work
          zip -r -1 "$GITHUB_WORKSPACE/amgraph-${{ steps.next.outputs.number }}.zip" \
            manifest.json \
            valhalla.json \
            valhalla/tiles.tar \
            valhalla/admin.sqlite \
            boundaries/netherlands.geojson \
            boundaries/legal-zones.geojson
          ls -lh "$GITHUB_WORKSPACE/amgraph-${{ steps.next.outputs.number }}.zip"

      - name: Publish the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built from \`$GITHUB_SHA\`, gated on every access-tag"
            echo "combination in the country before it was published."
            echo
            echo '```json'
            cat infra/work/manifest.json
            echo '```'
          } > notes.md
          gh release create "release-${{ steps.next.outputs.number }}" \
            --title "Release ${{ steps.next.outputs.number }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/amgraph-${{ steps.next.outputs.number }}.zip"
